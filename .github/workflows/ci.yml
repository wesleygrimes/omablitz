name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Install Qt (qmltestrunner / qmllint)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-declarative-dev \
            qml6-module-qtquick \
            qml6-module-qtqml \
            qml6-module-qttest
          multiarch=$(dpkg-architecture -qDEB_HOST_MULTIARCH)
          echo "QML2_IMPORT_PATH=/usr/lib/${multiarch}/qt6/qml" >> "$GITHUB_ENV"
          echo "/usr/lib/qt6/bin" >> "$GITHUB_PATH"
          ls "/usr/lib/${multiarch}/qt6/qml" | head
          command -v qmllint qmltestrunner
          qmllint --version || true

      - name: Check
        run: mise run check
