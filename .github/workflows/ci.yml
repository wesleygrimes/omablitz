name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      # Official Qt builds — apt Qt on Ubuntu is incomplete for qmllint/qmltestrunner.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          cache: true
          install-deps: true

      - name: Verify Qt tools
        run: |
          command -v qmllint
          command -v qmltestrunner
          qmllint --version
          qmltestrunner -help >/dev/null
          echo "QML2_IMPORT_PATH=${QML2_IMPORT_PATH:-}"
          test -d "${QML2_IMPORT_PATH}/QtQuick"
          test -d "${QML2_IMPORT_PATH}/QtTest"

      - name: Check
        run: mise run check
