name: Feature request
description: Propose a change that fits the Omablitz UX
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Read [README.md](../README.md) first. Keep the feature set small — bar stays quiet, panels do the detail work.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change on screen or in behavior?
    validations:
      required: true
  - type: textarea
    id: fit
    attributes:
      label: Why it belongs
      description: How it fits the bar / Following / Game split (and what it should not do).
    validations:
      required: false
